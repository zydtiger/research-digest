minimum_prek_version: "0.4.14"
default_install_hook_types: [pre-commit, pre-push, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: builtin
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
      - id: require-pattern
        name: commit message prefix
        stages: [commit-msg]
        args: ['^(Merge |(feat|fix|docs|refactor|test|build|ci|perf|chore|revert)(\([a-z0-9-]+\))?: [a-z])']

  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv lock --check
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
      - id: ruff
        name: ruff check
        entry: uv run ruff check
        language: system
        pass_filenames: false
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        types: [python]
      - id: docs-layout
        name: Markdown lives in a declared slot
        language: fail
        entry: "Move to a slot listed in docs/README.md, or add one:"
        files: ^[^/]+\.md$|^docs/
        exclude: ^(README|AGENTS)\.md$|^docs/(README|GOAL|STATUS|ROADMAP|ARCHITECTURE|DECISIONS)\.md$
